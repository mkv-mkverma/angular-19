<div class="row text-center">
  <div class="col-md-12">
    <h3>Signals Example</h3>
    <button class="btn btn-primary m-1" (click)="increment()">Increment</button>
    <button class="btn btn-danger m-1" (click)="decrement()">Decrement</button>
    <button class="btn btn-secondary m-1" (click)="reset()">Reset</button>
    <br />
    <p>Counter: {{ counter() }}</p>
    <p>Normal Variable: {{ normalVariable }}</p>
  </div>

</div>
