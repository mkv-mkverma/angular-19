<div class="row text-center">
  <div class="col-md-6 offset-md-3">
    <h1>User</h1>
    <input
      type="email"
      class="form-control mb-2"
      placeholder="Enter your email"
    />
    <input
      type="password"
      class="form-control"
      placeholder="Enter your password"
    />
    <button class="btn btn-primary mt-3" (click)="login()">Login</button>
  </div>
</div>
