<div class="container">
  <h3>CRUD Operations: User Details</h3>
  <button class="btn btn-success mb-3" (click)="createUser()">
    <i class="bi bi-plus-circle"></i> Add User
  </button>
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of usersList$ | async; track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>
            <!-- Add buttons for edit and delete actions -->
            <button class="btn btn-primary m-1" (click)="viewUser(user)">
              <i class="bi bi-eye"></i>
            </button>
            <button class="btn btn-primary m-1" (click)="editUser(user)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-danger m-1" (click)="deleteUser(user)">
              <i class="bi bi-trash3"></i>
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="text-center text-muted">No users found.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
